<app-export-menu [fileBase]="npc().name" fallbackName="npc" [text]="toText" [markdown]="toMarkdown">
  <ng-container ngProjectAs="[exportOptions]">
    <div class="field-check">
      <input id="export-descriptions" type="checkbox" [checked]="descriptions.value()" (change)="descriptions.set($any($event.target).checked)" />
      <label for="export-descriptions">Include spell and heroic ability descriptions</label>
    </div>
    <div class="field-check">
      <input id="export-attributes" type="checkbox" [checked]="attributes.value()" (change)="attributes.set($any($event.target).checked)" />
      <label for="export-attributes">Show attributes</label>
    </div>
  </ng-container>
  <app-npc-card [card]="card()" />
</app-export-menu>
